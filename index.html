<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seilwinde</title>
<style>
:root{--bg:#f3f5f7;--fg:#14202b;--card:#fff;--line:#c9d1d9;--acc:#0a7d6b;--stop:#c0392b;--mut:#5b6773;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--fg:#e8eef3;--card:#18222b;--line:#2b3946;--acc:#35c9ad;--stop:#ff6b5a;--mut:#93a1ae}}
:root[data-theme="dark"]{--bg:#10171d;--fg:#e8eef3;--card:#18222b;--line:#2b3946;--acc:#35c9ad;--stop:#ff6b5a;--mut:#93a1ae}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:4px 0 0}
#status{font-size:14px;color:var(--mut)}
button{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#conn{padding:14px;font-weight:600}
#conn.on{border-color:var(--acc);color:var(--acc)}
.dir{display:flex;flex-direction:column;gap:10px;flex:1}
.dir button{font-size:26px;font-weight:700;min-height:96px}
#up.active,#down.active{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#stop{background:var(--stop);border-color:var(--stop);color:#fff;min-height:84px}
.speed{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px}
.speed label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}
input[type=range]{width:100%;height:40px;accent-color:var(--acc)}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Seilwinde</h1>
  <div id="status">Nicht verbunden</div>
  <button id="conn">Mit Hub verbinden</button>
  <div class="dir">
    <button id="up" disabled>▲ Hoch</button>
    <button id="stop" disabled>Stopp</button>
    <button id="down" disabled>▼ Runter</button>
  </div>
  <div class="speed">
    <label for="spd"><span>Geschwindigkeit</span><span id="spdv">3</span></label>
    <input id="spd" type="range" min="1" max="9" step="1" value="3" disabled>
  </div>
  <small>Das Programm „seilwinde" muss auf dem Hub laufen (große Taste). Der Hub darf nicht mit dem Rechner verbunden sein.</small>
</main>
<script>
const SVC="c5f50001-8280-46da-89f4-6d8051e4aeef", CHR="c5f50002-8280-46da-89f4-6d8051e4aeef";
let ch=null;
const $=id=>document.getElementById(id);
const st=t=>$("status").textContent=t;
function enable(on){["up","down","stop","spd"].forEach(i=>$(i).disabled=!on)}
async function send(c){
  if(!ch) return;
  try{ await ch.writeValueWithResponse(new Uint8Array([0x06,c.charCodeAt(0)])); }
  catch(e){ st("Senden fehlgeschlagen: "+e.message); }
}
function mark(d){$("up").classList.toggle("active",d==="+");$("down").classList.toggle("active",d==="-")}
$("conn").onclick=async()=>{
  if(!navigator.bluetooth){st("Dieser Browser kann kein Web Bluetooth. Öffne die Seite in Bluefy.");return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    dev.addEventListener("gattserverdisconnected",()=>{ch=null;enable(false);$("conn").classList.remove("on");$("conn").textContent="Mit Hub verbinden";st("Verbindung getrennt")});
    var step="Verbinde mit Hub";
    st(step+" …");
    const srv=await dev.gatt.connect();
    step="Dienst suchen";st(step+" …");
    const svc=await srv.getPrimaryService(SVC);
    step="Kanal suchen";st(step+" …");
    ch=await svc.getCharacteristic(CHR);
    step="Benachrichtigungen starten";st(step+" …");
    try{await ch.startNotifications();}catch(e){}
    enable(true);$("conn").classList.add("on");$("conn").textContent="Verbunden: "+(dev.name||"Hub");
    st("Bereit");
  }catch(e){st("Fehler ("+(typeof step!=="undefined"?step:"Auswahl")+"): "+e.name+" – "+e.message)}
};
$("up").onclick=()=>{send("+");mark("+")};
$("down").onclick=()=>{send("-");mark("-")};
$("stop").onclick=()=>{send("s");mark("")};
$("spd").oninput=e=>{$("spdv").textContent=e.target.value};
$("spd").onchange=e=>send(e.target.value);
</script>
</body>
</html>
